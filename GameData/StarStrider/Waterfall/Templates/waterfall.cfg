
@PART[BKI_25PodLESRCS]:NEEDS[Waterfall]:AFTER[StarStrider]
{
  // Removes the stock effect block, and replace it with one that has no particles
  !EFFECTS {}
  EFFECTS
  {
    running
	{
		AUDIO_MULTI_POOL
		{
			channel = Ship
			transformName = rcs
			clip = sound_rocket_mini
			volume = 0.0 0.0
			volume = 0.02 0.1
			volume = 0.5 0.1
			volume = 1.0 0.1
			pitch = 0.0 0.75
			pitch = 1.0 1.5
			loop = true
		}
    }
  }
  MODULE
  {
    name = ModuleWaterfallFX
    // This is a custom name
    moduleID = rcsAAM
    // This links the effects to a given ModuleEngines
    engineID = basicEngine

    // List out all controllers we want available
	ATMOSPHEREDENSITYCONTROLLER
	{
		name = atmosphereDepth
	}
	RCSCONTROLLER
	{
		name = rcs
		responseRateUp = 100
		responseRateDown = 0.3
		thrusterTransformName = rcs
	}
	RANDOMNESSCONTROLLER
	{
		name = random
		noiseType = random
		range = 0,1
	}
    TEMPLATE
    {
      // This is the name of the template to use
      templateName = orian-SRM-rcs
      // This field allows you to override the parentTransform name in the EFFECTS contained in the template
      overrideParentTransform = thrustTransform
      scale = .9,0.95,.9
      rotation = 0,0,180
      position = 0,0,0
    }
  }
}

@PART[BKI_25PodLESMotor]:NEEDS[Waterfall]:AFTER[StarStrider]
{
  // Removes the stock effect block, and replace it with one that has no particles
  !EFFECTS {}
    @MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesFX
		%powerEffectName = SolidSmoke2
	}
	AvPLUME
	{
		name = SolidSmoke2
		transformName = thrustTransform
		localRotation = 0,0,0
		localPosition = 0,0,-6
		fixedScale = 1.2
		energy = 2
		speed = 1
	}
  EFFECTS
	{
		running_closed
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_spurts
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.2
				pitch = 1.0 1.0
				loop = true
			}
			// MODEL_MULTI_PARTICLE
			// {
				// modelName = Squad/FX/LES_Thruster
				// transformName = thrustTransform
				// emission = 0.0 0.0
				// emission = 0.05 0.0
				// emission = 0.075 0.25
				// emission = 1.0 1.25
				// speed = 0.0 0.5
				// speed = 1.0 1.2
			// }
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = orianAM
		version = FixedRampRates
		ATMOSPHEREDENSITYCONTROLLER
		{
			name = atmosphereDepth
		}
		THROTTLECONTROLLER
		{
			responseRateUp = 50
			responseRateDown = 0.1
			engineID = LES
			name = throttle
		}
		RANDOMNESSCONTROLLER
		{
			range = 0,1
			noiseType = random
			scale = 1
			minimum = 0
			speed = 1
			name = random
		}
		TEMPLATE
		{
			templateName = StarStrider-SRM-AM
			overrideParentTransform = thrustTransform
			position = 0,0,-0.05
			rotation = -90, 0, 0
			scale = 2.31, 2, 2.31
		}
	}
}

