@PART[*]:HAS[@AvPLUME[SolidSmoke3]]:AFTER[zStarStrider]:NEEDS[SmokeScreen]
{
    %EFFECTS
    {
        SolidSmoke3
        {
            plumeIdentifier = #$/AvPLUME[SolidSmoke3]/plumeIdentifier$

            MODEL_MULTI_SHURIKEN_PERSIST
            {
                //Get the inputs from the other config.
                transformName = #$/AvPLUME[SolidSmoke3]/transformName$
                localRotation = #$/AvPLUME[SolidSmoke3]/localRotation$
                localPosition = #$/AvPLUME[SolidSmoke3]/plumePosition$
                fixedScale    = #$/AvPLUME[SolidSmoke3]/plumeScale$
                energy        = #$/AvPLUME[SolidSmoke3]/energy$
                speed         = #$/AvPLUME[SolidSmoke3]/speed$
                emissionMult  = 8
                alphaMult     = #$/AvPLUME[SolidSmoke3]/alphaMult$
                saturationMult  = #$/AvPLUME[SolidSmoke3]/saturationMult$
                //
                name = #$/AvPLUME[SolidSmoke3]/plumeIdentifier$-smoke
                modelName = StarStrider/Waterfall/Templates/MP_Nazari_FX/smokelaunch
				speed = 0.0 5
				speed = 1.0 5
                grow = 0.0 18.4
				grow = 1.0 18.4
                renderMode = "Billboard"
                collide = false
                collideRatio = 0
                sizeClamp = 250
                angle = 0.0 1.0
                angle = 45.0 1.0
                angle = 50.0 1.0
                distance = 0.0 1.0
                distance = 100.0 1.0
                distance = 110.0 1.0
                offset
                {
  density = 1 9
  density = 0.2 6
  density = 0 4
  power = 1 0
  power = 0.1 0
  power = 0 -3
                }
                logGrow
				{
				  density = 1.0 15
				  density = 0.1 20
				  density = 0.0 2
				}
				logGrowScale
				{
				  density = 1.0 1
				  density = 0.8 1.5
				  density = 0.46 2
				  density = 0.2 2
				  density = 0.1 2
				  density = 0.0 5
				}
				linGrow
				{
				  density = 1.0 0
				  density = 0.46 0
				  density = 0.2 0
				  density = 0.05 5
				  density = 0.0 10
				}
                emission
                {
                  density = 1.0 2.5
                  density = 0.05 2
                  density = 0.0 0
                  power = 1 1
                  power = 0.01 0.2
                  power = 0 0
                }
                energy
                {
                  density = 1.0 2.5
                  density = 0.3 2.5
                  density = 0.05 0.01
                  density = 0.0 0.0
                }
                size
                {
                  density = 1.0 1
                  density = 0.9 2
                  density = 0.6 3
                  density = 0.2 4
                  density = 0.0 8
                }
            }
            AUDIO
            {
                name = #$/AvPLUME[SolidSmoke3]/plumeIdentifier$-audio
                channel = Ship
                clip = Avalanche/Templates/SmokeScreen/KW_Sounds/sound_srbloop
                volume = 0.0 0.0
                volume = #$/AvPLUME[SolidSmoke3]/plumeScale$
                @volume,1 ^= :^:2.0 :
                pitch = 0.0 1.0
                pitch = 1.0 1.0
                loop = true
            }
        }
        &engage
        {
            AUDIO
            {
                channel = Ship
                clip = Avalanche/Templates/SmokeScreen/KW_Sounds/sound_srb1
                volume = #$/AvPLUME[SolidSmoke3]/plumeScale$
                pitch = 1.0
                loop = false
            }
        }
        &disengage
        {
            AUDIO
            {
                channel = Ship
                clip = sound_vent_soft
                volume = 1.0
                pitch = 2.0
                loop = false
            }
        }
        &flameout
        {
            AUDIO
            {
                channel = Ship
                clip = sound_explosion_low
                volume = 1.0
                pitch = 2.0
                loop = false
            }
        }
    }
}
