@PART[BKI25_Pod]:NEEDS[Reviva&FreeIva&ASET&JSI]:FOR[StarStrider]{
	INTERNAL
	{
		name = BKI25PodInternal_ASET
	}
	MODULE
    {
        name = ModuleFreeIva
        passThroughNodeA = top
        doesNotBlockEVA = true
    }
	MODULE
	{
		name = ModuleIVASwitch
		internalName = BKI25PodInternal_ASET
	}
	MODULE
	{
		name = RasterPropMonitorComputer
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[WindowSize]]
	{
		@SUBTYPE[SmallWindows]
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleIVASwitch
				}
				
				DATA
				{
					internalName = BKI25PodInternal_ASET
				}
			}
		}
		@SUBTYPE[BigWindows]
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleIVASwitch
				}
				
				DATA
				{
					internalName = BKI25PodInternal_ASET_Big_Windows
				}
			}
		}
	}
}